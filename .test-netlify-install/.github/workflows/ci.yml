name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundry
          POSTGRES_PASSWORD: foundry
          POSTGRES_DB: foundry
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://foundry:foundry@localhost:5432/foundry
          DIRECT_URL: postgresql://foundry:foundry@localhost:5432/foundry

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://foundry:foundry@localhost:5432/foundry
          DIRECT_URL: postgresql://foundry:foundry@localhost:5432/foundry
          APP_URL: http://localhost:3000

      - name: Start server
        run: npm start &
        env:
          DATABASE_URL: postgresql://foundry:foundry@localhost:5432/foundry
          DIRECT_URL: postgresql://foundry:foundry@localhost:5432/foundry
          APP_URL: http://localhost:3000

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 2
          done
          exit 1

      - name: Health check
        run: curl -sf http://localhost:3000/api/health

      - name: Phase 2 tests
        run: node scripts/phase2-test.mjs
        env:
          APP_URL: http://localhost:3000

      - name: Phase 6 production tests
        run: node scripts/phase6-test.mjs
        env:
          APP_URL: http://localhost:3000

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
