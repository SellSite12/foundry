[build]
  command = "node scripts/netlify-build.mjs"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"
  UPLOAD_STORE = "blobs"
  APP_VERSION = "1.0.0"
  NPM_CONFIG_PRODUCTION = "false"
  NPM_FLAGS = "--include=optional"

[functions]
  included_files = ["node_modules/.prisma/**", "node_modules/@prisma/client/**"]
